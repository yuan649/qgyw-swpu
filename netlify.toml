# 纯静态、无构建：publish 指向仓库根。
# 注意：根目录下的 .workbuddy/（本地审计脚本、备份、截图）不参与部署——
# 用 git 部署时 .gitignore 已排除；手动上传时只传这 27 个文件：
# index.html / robots.txt / sitemap.xml / netlify.toml / css/* / js/* / images/*
[build]
  publish = "."

# 图片文件名不带 hash，靠「换图就换文件名」保证 immutable 安全。
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# css/js 用了 ?v=YYYYMMDD 版本号，7 天强缓存 + 7 天后协商。
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# 文档本身永远协商，避免版本号更新后拿到旧 HTML。
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
